name: Deploy Portfolio

on:
  push:
    branches:
      - v2

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        run: pnpm build

      - name: Prepare standalone package
        run: |
          mkdir -p .next/standalone/.next

          cp -r .next/static .next/standalone/.next/

          if [ -d "public" ]; then
            cp -r public .next/standalone/
          fi

      - name: Create deployment archive
        run: |
          tar -czf portfolio.tar.gz \
            -C .next/standalone .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: portfolio
          path: portfolio.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Azure VM
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: portfolio

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/portfolio_deploy
          chmod 600 ~/.ssh/portfolio_deploy

          ssh-keyscan -H "${{ secrets.AZURE_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment
        run: |
          scp \
            -i ~/.ssh/portfolio_deploy \
            -o IdentitiesOnly=yes \
            portfolio.tar.gz \
            "${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }}:/tmp/portfolio.tar.gz"

      - name: Deploy and restart
        run: |
          ssh \
            -i ~/.ssh/portfolio_deploy \
            -o IdentitiesOnly=yes \
            "${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }}" << 'EOF'

            set -e

            APP_DIR="/var/www/portfolio"
            RELEASE_DIR="$APP_DIR/.next/standalone"
            NEW_RELEASE="$APP_DIR/.next/standalone.new"

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Application directory does not exist: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            echo "Preparing new deployment..."

            rm -rf "$NEW_RELEASE"
            mkdir -p "$NEW_RELEASE"

            tar -xzf /tmp/portfolio.tar.gz \
              -C "$NEW_RELEASE"

            rm -f /tmp/portfolio.tar.gz

            echo "Replacing standalone build..."

            rm -rf "$RELEASE_DIR"
            mv "$NEW_RELEASE" "$RELEASE_DIR"

            if [ ! -f "$RELEASE_DIR/server.js" ]; then
              echo "ERROR: server.js was not found."
              exit 1
            fi

            echo "Restarting PM2..."

            if pm2 describe portfolio > /dev/null 2>&1; then
              PORT=3000 \
              HOSTNAME=127.0.0.1 \
              pm2 restart portfolio --update-env
            else
              PORT=3000 \
              HOSTNAME=127.0.0.1 \
              pm2 start "$RELEASE_DIR/server.js" \
                --name portfolio
            fi

            pm2 save

            echo "PM2 status:"
            pm2 status

            echo "Deployment completed successfully."

          EOF
