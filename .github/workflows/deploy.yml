name: Deploy Portfolio

on:
  push:
    branches:
      - v3

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: pnpm build

      - name: Create deployment archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=node_modules \
            --exclude=.next/cache \
            -czf /tmp/portfolio.tar.gz \
            -C "$GITHUB_WORKSPACE" .

          cp /tmp/portfolio.tar.gz portfolio.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: portfolio
          path: portfolio.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Azure VM
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: production

    steps:
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: portfolio

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/portfolio_deploy
          chmod 600 ~/.ssh/portfolio_deploy

          ssh-keyscan -H "${{ secrets.AZURE_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment
        run: |
          scp \
            -i ~/.ssh/portfolio_deploy \
            -o IdentitiesOnly=yes \
            portfolio.tar.gz \
            "${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }}:/tmp/portfolio.tar.gz"

      - name: Deploy and restart
        run: |
          ssh \
            -i ~/.ssh/portfolio_deploy \
            -o IdentitiesOnly=yes \
            "${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_HOST }}" << 'EOF'

            set -e

            APP_DIR="/var/www/portfolio"

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Application directory does not exist: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            echo "Pulling latest code from git..."

            git fetch origin v3
            git reset --hard origin/v3

            echo "Extracting deployment build artifacts..."

            tar -xzf /tmp/portfolio.tar.gz -C "$APP_DIR"

            rm -f /tmp/portfolio.tar.gz

            echo "Installing dependencies..."

            pnpm install --frozen-lockfile

            echo "Running database migrations..."

            pnpm migrate

            echo "Starting / restarting PM2..."

            # Clean up old v2 process name if it exists to avoid port 3000 conflict
            if pm2 describe portfolio > /dev/null 2>&1; then
              echo "Stopping old portfolio process..."
              pm2 delete portfolio || true
            fi

            pm2 startOrRestart ecosystem.config.cjs --update-env

            pm2 save

            echo "PM2 status:"
            pm2 status

            echo "Deployment completed successfully."

          EOF
